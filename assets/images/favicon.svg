  <circle cx="250" cy="250" r="248" fill="#fff"/>
  <!-- Four rings: offset horizontally (OFFSET_K = 0.5, � = 0) -->
  <circle cx="250"   cy="250" r="215" fill="none" stroke="#1ECBE1" stroke-width="12"/>
  <circle cx="272.5" cy="250" r="170" fill="none" stroke="#1ECBE1" stroke-width="12"/>
  <circle cx="294"   cy="250" r="127" fill="none" stroke="#1ECBE1" stroke-width="12"/>
  <circle cx="315"   cy="250" r="85"  fill="none" stroke="#1ECBE1" stroke-width="12"/>
  <!-- SPS text at innermost ring centre -->
  <text x="315" y="250"
